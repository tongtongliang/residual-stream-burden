[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sihc"
version = "0.1.0"
description = "Spatially Indexed Hyperconnections with fused block and sublayer routing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.8", "torchvision", "triton", "numpy", "pillow"]

[project.optional-dependencies]
eval = ["torch-fidelity==0.4.0"]
parquet = ["pyarrow"]
tracking = ["wandb"]
repa = ["transformers==4.57.3"]
dev = ["pytest"]
bench = ["einops==0.8.2"]
research = ["matplotlib", "pandas", "scipy", "pyyaml", "omegaconf", "einops==0.8.2", "huggingface_hub"]

[project.scripts]
sihc-train = "training.train:main"
sihc-sample = "evaluation.sample:main"
sihc-evaluate = "evaluation.evaluate:main"
sihc-export = "evaluation.export_checkpoint:main"

[tool.setuptools]
packages = ["bench", "data", "evaluation", "research", "research.long_skip", "research.long_skip.vendor", "research.long_skip.vendor.flowmatching_lthc", "research.long_skip.vendor.flowmatching_lthc.models", "research.long_skip.vendor.scripts", "research.pixel", "research.rae", "research.toy", "sihc", "sihc.models", "sihc.models.sihc", "sihc.optim", "sihc.rae", "training"]
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-dir]
sihc = "sihc"
training = "sihc/training"
evaluation = "sihc/evaluation"
data = "sihc/data"
bench = "sihc/bench"
research = "research"

[tool.pytest.ini_options]
testpaths = ["sihc/tests"]

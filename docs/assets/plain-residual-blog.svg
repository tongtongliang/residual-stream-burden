<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Source Serif 4', Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16202b" stroke-width="1.2"/>
    </marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#8899aa" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="260" fill="none"/>

  <!-- P×P patch -->
  <rect x="16" y="100" width="56" height="56" rx="5" fill="#f0ebe4" stroke="#bfb5a5" stroke-width="1.2"/>
  <text x="44" y="132" text-anchor="middle" font-size="12" font-style="italic" fill="#5d6878">P×P</text>
  <text x="44" y="148" text-anchor="middle" font-size="11" fill="#5d6878">patch</text>

  <!-- Arrow: patch → embed -->
  <line x1="76" y1="128" x2="104" y2="128" stroke="#16202b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Linear Embed -->
  <rect x="108" y="108" width="80" height="40" rx="5" fill="#f4f6f9" stroke="#d0d5dd" stroke-width="1.2"/>
  <text x="148" y="132" text-anchor="middle" font-size="12" fill="#16202b">Linear Embed</text>

  <!-- Arrow: embed → h₀ -->
  <line x1="192" y1="128" x2="220" y2="128" stroke="#16202b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- h₀ -->
  <rect x="224" y="112" width="36" height="32" rx="4" fill="#e8edf4" stroke="#9aafcc" stroke-width="1.2"/>
  <text x="242" y="131" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#16202b">h₀</text>

  <!-- Skip connection (curved path going above) -->
  <path d="M260,120 C280,120 280,56 320,56 L460,56 C500,56 500,120 520,120"
        fill="none" stroke="#8899aa" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="390" y="46" text-anchor="middle" font-size="11" fill="#8899aa" font-style="italic">identity path</text>

  <!-- Arrow: h₀ → Layer -->
  <line x1="264" y1="128" x2="296" y2="128" stroke="#16202b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Layer block -->
  <rect x="300" y="104" width="100" height="48" rx="6" fill="#2f3a48" stroke="none"/>
  <text x="350" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Layer</text>

  <!-- Arrow: Layer → Δh -->
  <line x1="404" y1="128" x2="432" y2="128" stroke="#16202b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Δh₀ -->
  <rect x="436" y="112" width="40" height="32" rx="4" fill="#e8edf4" stroke="#9aafcc" stroke-width="1.2"/>
  <text x="456" y="131" text-anchor="middle" font-size="12" font-weight="600" font-style="italic" fill="#16202b">Δh₀</text>

  <!-- Arrow: Δh → + -->
  <line x1="480" y1="128" x2="508" y2="128" stroke="#16202b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Plus circle -->
  <circle cx="524" cy="128" r="14" fill="none" stroke="#16202b" stroke-width="1.4"/>
  <line x1="517" y1="128" x2="531" y2="128" stroke="#16202b" stroke-width="1.6"/>
  <line x1="524" y1="121" x2="524" y2="135" stroke="#16202b" stroke-width="1.6"/>

  <!-- Dots for repetition -->
  <text x="556" y="132" font-size="16" fill="#8899aa">⋯</text>

  <!-- hL -->
  <rect x="578" y="112" width="36" height="32" rx="4" fill="#e8edf4" stroke="#9aafcc" stroke-width="1.2"/>
  <text x="596" y="131" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#16202b">h<tspan font-size="10" dy="3">L</tspan></text>

  <!-- Arrow: hL → readout -->
  <line x1="618" y1="128" x2="636" y2="128" stroke="#16202b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Linear Readout -->
  <rect x="640" y="108" width="68" height="40" rx="5" fill="#f4f6f9" stroke="#d0d5dd" stroke-width="1.2"/>
  <text x="674" y="125" text-anchor="middle" font-size="11" fill="#16202b">Linear</text>
  <text x="674" y="140" text-anchor="middle" font-size="11" fill="#16202b">Readout</text>

  <!-- Annotation: residual stream -->
  <line x1="224" y1="168" x2="614" y2="168" stroke="#2458c6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="224" y1="148" x2="224" y2="172" stroke="#2458c6" stroke-width="1" opacity="0.5"/>
  <line x1="614" y1="148" x2="614" y2="172" stroke="#2458c6" stroke-width="1" opacity="0.5"/>
  <text x="419" y="190" text-anchor="middle" font-size="12" fill="#2458c6" font-style="italic">residual stream — carries both memory and workspace</text>

  <!-- Annotation at bottom: what must be preserved -->
  <text x="419" y="216" text-anchor="middle" font-size="11.5" fill="#5d6878">One state of width <tspan font-style="italic">C</tspan> carries information forward and supplies the input to each layer.</text>
  <text x="419" y="236" text-anchor="middle" font-size="11.5" fill="#5d6878">If the output requires some input information, that information must stay in the stream.</text>
</svg>